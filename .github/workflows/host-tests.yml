name: Host tests

on:
  push:
    branches: [main, develop, release/*, feature/*, bugfix/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-ctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure and test
        run: |
          cmake -S . -B build -DHF_DYNAMIXEL_BUILD_TESTS=ON -DHF_DYNAMIXEL_BUILD_HOST_EXAMPLE=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure
          ./build/examples/host/hf_dynamixel_host_ping_read
      - name: Install prefix smoke
        run: |
          cmake --install build --prefix "${RUNNER_TEMP}/hf-dynamixel"
          test -f "${RUNNER_TEMP}/hf-dynamixel/include/dynamixel.hpp"
          test -f "${RUNNER_TEMP}/hf-dynamixel/lib/libhf_dynamixel.a"
