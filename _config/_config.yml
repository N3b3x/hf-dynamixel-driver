# =============================================================================
# Jekyll configuration for HardFOC Dynamixel driver documentation
# =============================================================================

title: "HardFOC Dynamixel Driver"
description: >
  Protocol 2.0 Dynamixel wrapper around ROBOTIS SDK 4.1.0. Portable C++17
  Bus/Device API, XC430-W150 plus shared X-series fallback, ESP32-C6/S3 examples.

baseurl: "/hf-dynamixel-driver"
url: "https://n3b3x.github.io"

author:
  name: "N3b3x"
  email: "n3b3x@example.com"
  url: "https://github.com/n3b3x"

layouts_dir: _config/_layouts
includes_dir: _config/_includes

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-redirect-from
  - jekyll-optional-front-matter

nav_next_prev: true

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

timezone: UTC
encoding: utf-8
lang: en

search_enabled: true
search:
  heading_level: 3
  previews: 5
  preview_words_before: 10
  preview_words_after: 15
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true

nav_enabled: true
heading_anchors: true
breadcrumbs: true
toc:
  min_level: 2
  max_level: 4

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: red

color_scheme: dark
toggle_color_scheme: true
toggle_auto_mode: true

aux_links:
  "GitHub Repository":
    - "https://github.com/N3b3x/hf-dynamixel-driver"
  "Report Issues":
    - "https://github.com/N3b3x/hf-dynamixel-driver/issues"
  "API (Doxygen)":
    - "https://n3b3x.github.io/hf-dynamixel-driver/html/"

footer_content: >
  Built with Just the Docs •
  <a href='https://github.com/N3b3x/hf-dynamixel-driver/blob/main/LICENSE'>MIT License</a> •
  Dynamixel SDK is Apache-2.0 •
  <a href='https://github.com/N3b3x/hf-dynamixel-driver'>View on GitHub</a>

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .github
  - "*.gem"
  - "*.gemspec"
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - examples/esp32/scripts/
  - _config/doxygen-extensions/
  - src/
  - inc/
  - tests/
  - external/

include:
  - _pages
  - ../README.md
  - ../LICENSE
  - assets/
  - _config/404.html

seo:
  type: "SoftwareApplication"
  name: "HardFOC Dynamixel Driver"
  description: >
    Protocol 2.0 Dynamixel wrapper around ROBOTIS SDK 4.1.0 with ESP32-C6/S3 examples
  url: "https://n3b3x.github.io/hf-dynamixel-driver"
  twitter:
    card: "summary_large_image"
    site: "@n3b3x"
  og:
    type: "website"
    locale: "en_US"

social:
  name: "HardFOC Dynamixel Driver"
  links:
    - "https://github.com/N3b3x/hf-dynamixel-driver"
    - "https://github.com/n3b3x"

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: [html, head, body]

just_the_docs:
  nav_fold: true
  nav_external_links:
    - title: "GitHub Repository"
      url: "https://github.com/N3b3x/hf-dynamixel-driver"
    - title: "Issues"
      url: "https://github.com/N3b3x/hf-dynamixel-driver/issues"
  head_custom: _includes/head_custom.html
  custom_css:
    - assets/css/custom.css
  custom_js:
    - assets/js/custom.js
